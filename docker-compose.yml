# ==============================================================================
# SignBridge Universal — Enterprise Production Orchestration
# Supports 1-Command Deployment: `docker compose up -d`
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: signbridge-backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80
      - DATABASE_URL=sqlite:////app/data/signbridge.db
    volumes:
      - signbridge_data:/app/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - signbridge_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: signbridge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/nginx-health"]
      interval: 20s
      timeout: 3s
      retries: 3
    networks:
      - signbridge_net

volumes:
  signbridge_data:
    name: signbridge_clinical_data

networks:
  signbridge_net:
    name: signbridge_network
    driver: bridge
